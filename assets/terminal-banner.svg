<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title description">
  <title id="title">Nosfeik — pentesting, Linux y redes</title>
  <desc id="description">Terminal con el perfil de Nosfeik: ingeniero en Redes Inteligentes y Ciberseguridad. Entorno: Arch Linux, Hyprland y zsh. Blog: nosfeik.com.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b2c" />
      <stop offset="1" stop-color="#0d1117" />
    </linearGradient>
    <style>
      text { font-family: "DejaVu Sans Mono", Consolas, monospace; }
      .muted { fill: #9daec2; }
      .text { fill: #e6edf3; }
      .accent { fill: #79c0ff; }
      .cursor { animation: blink 1.4s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="958" height="318" rx="16" fill="url(#background)" stroke="#303d50" stroke-width="2" />
